apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-verify-config
  namespace: openclaw
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      # 将接收到的 trace 打到日志里（用于验证链路）
      logging:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-verify
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-verify
  template:
    metadata:
      labels:
        app: otel-collector-verify
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: cfg
              mountPath: /etc/otel
      volumes:
        - name: cfg
          configMap:
            name: otel-collector-verify-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: openclaw
spec:
  selector:
    app: otel-collector-verify
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

